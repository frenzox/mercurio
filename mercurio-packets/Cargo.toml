[package]
name = "mercurio-packets"
version = "0.2.1"
edition.workspace = true
rust-version.workspace = true
description = "MQTT packet encoding and decoding for the Mercurio MQTT implementation"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["mqtt", "mqtt5", "iot", "protocol", "no-std"]
categories = ["network-programming", "encoding", "no-std"]

[features]
default = ["std"]
std = ["mercurio-core/std"]

[dependencies]
bytes.workspace = true

mercurio-core = { path = "../mercurio-core", version = "0.2.0", default-features = false }
