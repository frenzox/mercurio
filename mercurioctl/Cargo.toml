[package]
name = "mercurioctl"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Command-line administration for the Mercurio MQTT broker"
license = "MIT OR Apache-2.0"
repository = "https://github.com/frenzox/mercurio"
homepage = "https://frenzox.github.io/mercurio/"
keywords = ["mqtt", "mqtt5", "broker", "admin", "cli"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "mercurioctl"
path = "src/main.rs"

[dependencies]
mercurio-client = { path = "../mercurio-client", version = "0.4.0", features = ["clap"] }

bytes = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "time"] }

[dev-dependencies]
mercurio-server = { path = "../mercurio-server" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
