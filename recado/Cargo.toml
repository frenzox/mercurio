[package]
name = "recado"
version = "0.3.2"
edition.workspace = true
rust-version.workspace = true
description = "MQTT command-line client for publishing and subscribing, from the Mercurio project"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["mqtt", "mqtt5", "cli", "iot", "pubsub"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "recado"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
mercurio-client = { path = "../mercurio-client", version = "0.6.1", features = ["clap", "websocket"] }

base64.workspace = true
clap.workspace = true
clap_complete.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time", "io-std", "io-util"] }
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
mercurio-server = { path = "../mercurio-server" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "time"] }

[package.metadata.deb]
maintainer = "Guilherme Felipe da Silva <gfsilva.eng@gmail.com>"
section = "net"
extended-description = """\
recado publishes MQTT messages and subscribes to topics from the command
line, over TCP or TLS, with MQTT 3.1.1 and 5.0. It works with any MQTT
broker."""
depends = "libc6 (>= 2.18), libgcc-s1 | libgcc1"
assets = [
    ["target/release/recado", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/recado/README.md", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/recado", dest = "/usr/bin/recado", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/recado/README.md", mode = "644", doc = true },
]
