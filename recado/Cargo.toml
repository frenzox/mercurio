[package]
name = "recado"
version = "0.2.4"
edition = "2021"
rust-version = "1.89"
description = "MQTT command-line client for publishing and subscribing, from the Mercurio project"
license = "MIT OR Apache-2.0"
repository = "https://github.com/frenzox/mercurio"
homepage = "https://frenzox.github.io/mercurio/"
keywords = ["mqtt", "mqtt5", "cli", "iot", "pubsub"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "recado"
path = "src/main.rs"

[dependencies]
mercurio-client = { path = "../mercurio-client", version = "0.4.1", features = ["clap", "websocket"] }

base64 = "0.22"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "io-std", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
mercurio-server = { path = "../mercurio-server" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }

[package.metadata.deb]
maintainer = "Guilherme Felipe da Silva <gfsilva.eng@gmail.com>"
section = "net"
extended-description = """\
recado publishes MQTT messages and subscribes to topics from the command
line, over TCP or TLS, with MQTT 3.1.1 and 5.0. It works with any MQTT
broker."""
depends = "libc6 (>= 2.18), libgcc-s1 | libgcc1"
assets = [
    ["target/release/recado", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/recado/README.md", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/recado", dest = "/usr/bin/recado", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/recado/README.md", mode = "644", doc = true },
]
