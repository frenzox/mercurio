[package]
name = "mercurio-client"
version = "0.4.1"
edition = "2021"
rust-version = "1.89"
description = "MQTT client library for the Mercurio MQTT implementation"
license = "MIT OR Apache-2.0"
repository = "https://github.com/frenzox/mercurio"
homepage = "https://frenzox.github.io/mercurio/"
keywords = ["mqtt", "mqtt5", "client", "iot", "tokio"]
categories = ["network-programming", "asynchronous"]

[package.metadata.docs.rs]
all-features = true

[features]
# Command-line arguments for connecting, shared by the Mercurio tools
clap = ["dep:clap", "dep:rpassword"]

[dependencies]
mercurio-core = { path = "../mercurio-core", version = "0.2.0" }
mercurio-packets = { path = "../mercurio-packets", version = "0.2.1" }

bytes = "1"
tokio = { version = "1", features = ["net", "sync", "time", "macros", "rt", "io-util"] }
tokio-rustls = "0.26"
rustls = "0.23"
webpki-roots = "0.26"
tracing = "0.1"
thiserror = "1"
clap = { version = "4", features = ["derive", "env"], optional = true }
rpassword = { version = "7", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
mercurio-server = { path = "../mercurio-server" }
