[package]
name = "mercurio-client"
version = "0.6.1"
edition.workspace = true
rust-version.workspace = true
description = "MQTT client library for the Mercurio MQTT implementation"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["mqtt", "mqtt5", "client", "iot", "tokio"]
categories = ["network-programming", "asynchronous"]

[package.metadata.docs.rs]
all-features = true

[features]
default = ["tls"]
# Command-line arguments for connecting, shared by the Mercurio tools; their
# --ws needs WebSocket, so the flags don't depend on other crates' features
clap = ["dep:clap", "dep:rpassword", "websocket"]
# TLS connections, through rustls, trusting the operating system's
# certificate store
tls = ["dep:tokio-rustls", "dep:rustls", "dep:rustls-native-certs", "dep:webpki-roots"]
# MQTT over WebSocket, ws:// and, with tls, wss://
websocket = ["dep:tokio-tungstenite", "dep:futures-util"]

[lints]
workspace = true

[dependencies]
mercurio-core = { path = "../mercurio-core", version = "0.3.0" }
mercurio-packets = { path = "../mercurio-packets", version = "0.3.0" }
mercurio-scram = { path = "../mercurio-scram", version = "0.2.1" }

bytes = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["net", "sync", "time", "macros", "rt", "io-util"] }
tokio-rustls = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-native-certs = { version = "0.8", optional = true }
webpki-roots = { workspace = true, optional = true }
tokio-tungstenite = { workspace = true, optional = true }
futures-util = { workspace = true, features = ["sink", "std"], optional = true }
tracing.workspace = true
thiserror.workspace = true
clap = { workspace = true, features = ["env"], optional = true }
rpassword = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
mercurio-server = { path = "../mercurio-server" }
