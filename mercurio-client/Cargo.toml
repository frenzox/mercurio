[package]
name = "mercurio-client"
version = "0.1.0"
edition = "2021"
description = "MQTT client library for the Mercurio MQTT implementation"
license = "MIT OR Apache-2.0"
repository = "https://github.com/frenzox/mercurio"
homepage = "https://frenzox.github.io/mercurio/"
keywords = ["mqtt", "mqtt5", "client", "iot", "tokio"]
categories = ["network-programming", "asynchronous"]

[dependencies]
mercurio-core = { path = "../mercurio-core", version = "0.1.0" }
mercurio-packets = { path = "../mercurio-packets", version = "0.1.0" }

bytes = "1"
tokio = { version = "1", features = ["net", "sync", "time", "macros", "rt", "io-util"] }
tokio-util = { version = "0.7", features = ["codec"] }
tokio-rustls = "0.26"
rustls = "0.23"
webpki-roots = "0.26"
tracing = "0.1"
thiserror = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
mercurio-server = { path = "../mercurio-server" }
