[package]
name = "mercurio-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
bytes = "1"
mercurio-core = { path = "../mercurio-core" }
mercurio-packets = { path = "../mercurio-packets" }

# Kept out of the main workspace, as it builds on nightly with sanitizers
[workspace]
members = ["."]

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "topic"
path = "fuzz_targets/topic.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_direct"
path = "fuzz_targets/decode_direct.rs"
test = false
doc = false
bench = false

[[bin]]
name = "roundtrip"
path = "fuzz_targets/roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "message_properties"
path = "fuzz_targets/message_properties.rs"
test = false
doc = false
bench = false
