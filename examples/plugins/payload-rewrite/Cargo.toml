[package]
name = "payload-rewrite"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
mercurio-plugin = { path = "../../../mercurio-plugin" }

[profile.release]
opt-level = "s"

# Its own workspace: cargo would otherwise take the nearest workspace above it,
# which in a checkout nested in another (a git worktree) does not list it
[workspace]
