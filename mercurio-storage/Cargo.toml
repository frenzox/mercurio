[package]
name = "mercurio-storage"
version = "0.3.3"
edition = "2021"
rust-version = "1.89"
description = "Storage abstraction layer for Mercurio MQTT broker"
license = "MIT OR Apache-2.0"
repository = "https://github.com/frenzox/mercurio"
homepage = "https://frenzox.github.io/mercurio/"
keywords = ["mqtt", "broker", "sqlite", "postgres", "persistence"]
categories = ["network-programming", "database"]

[features]
# The `testing` module: the conformance suite every store should pass
test-util = []
sqlite = ["dep:rusqlite", "dep:tokio"]
postgres = [
    "dep:tokio",
    "dep:tokio-postgres",
    "dep:deadpool-postgres",
    "dep:futures-util",
    "dep:tokio-postgres-rustls",
    "dep:rustls",
    "dep:webpki-roots",
    "dep:tracing",
]

[dependencies]
mercurio-core = { path = "../mercurio-core", version = "0.2.0" }
async-trait.workspace = true
bytes = { workspace = true, features = ["std"] }
thiserror.workspace = true
rusqlite = { version = "0.41", features = ["bundled"], optional = true }
tokio = { workspace = true, features = ["rt", "sync", "time"], optional = true }
tokio-postgres = { version = "0.7", optional = true }
deadpool-postgres = { version = "0.14", optional = true }
futures-util = { workspace = true, features = ["std", "async-await", "async-await-macro"], optional = true }
tokio-postgres-rustls = { version = "0.14", optional = true }
rustls = { workspace = true, optional = true }
webpki-roots = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "time"] }

[package.metadata.docs.rs]
all-features = true
