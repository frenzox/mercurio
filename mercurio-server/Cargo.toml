[package]
name = "mercurio-server"
version = "0.3.0"
edition = "2021"
rust-version = "1.89"
description = "MQTT broker library for the Mercurio implementation"
license = "MIT OR Apache-2.0"
repository = "https://github.com/frenzox/mercurio"
homepage = "https://frenzox.github.io/mercurio/"
keywords = ["mqtt", "mqtt5", "broker", "iot", "server"]
categories = ["network-programming", "asynchronous"]

[dependencies]
bytes = "1.3"
smallvec = "1.11"
rand = "0.8"
thiserror = "1.0.38"
tokio = { version = "1.24", features = ["full"] }
tokio-rustls = "0.26"
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
rustls = "0.23"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1.2.2", features = ["v4"] }

mercurio-core = { path = "../mercurio-core", version = "0.2.0" }
mercurio-packets = { path = "../mercurio-packets", version = "0.2.0" }
mercurio-storage = { path = "../mercurio-storage", version = "0.3.0" }
x509-parser = "0.18"

[dev-dependencies]
mercurio-storage = { path = "../mercurio-storage", features = ["sqlite"] }
