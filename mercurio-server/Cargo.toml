[package]
name = "mercurio-server"
version = "0.5.0"
edition.workspace = true
rust-version.workspace = true
description = "MQTT broker library for the Mercurio implementation"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["mqtt", "mqtt5", "broker", "iot", "server"]
categories = ["network-programming", "asynchronous"]

[lints]
workspace = true

[dependencies]
bytes = { workspace = true, features = ["std"] }
smallvec = "1.11"
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "net", "sync", "time", "macros", "io-util", "fs"] }
socket2.workspace = true
tokio-rustls.workspace = true
tokio-tungstenite.workspace = true
getrandom.workspace = true
futures-util = { workspace = true, features = ["sink", "std"] }
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid = { version = "1.2.2", features = ["v4"] }
async-trait.workspace = true

mercurio-core = { path = "../mercurio-core", version = "0.2.0" }
mercurio-packets = { path = "../mercurio-packets", version = "0.2.1" }
mercurio-scram = { path = "../mercurio-scram", version = "0.1.0" }
mercurio-storage = { path = "../mercurio-storage", version = "0.3.3" }
x509-parser = "0.18"

[dev-dependencies]
mercurio-storage = { path = "../mercurio-storage", features = ["sqlite", "postgres"] }
# Paused clocks, for tests of retries spread over seconds
tokio = { workspace = true, features = ["full", "test-util"] }
