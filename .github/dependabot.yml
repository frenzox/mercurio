version: 2
updates:
  # The workflows pin actions by commit SHA; this keeps the pins current
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # One PR for the whole workspace, instead of one per crate
    groups:
      cargo:
        patterns: ["*"]
    commit-message:
      prefix: chore
      include: scope
