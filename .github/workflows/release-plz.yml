name: release-plz

on:
  push:
    branches: [master]

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'frenzox'
    permissions:
      actions: read
      contents: write
      pull-requests: read
      # crates.io trusted publishing
      id-token: write
    steps:
      # crates.io refuses trusted publishing from a workflow_run event, so
      # the job starts on the push and waits here for that push's build. A
      # failed or cancelled build fails the step and nothing is published.
      - name: Wait for the build to pass on this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for _ in $(seq 30); do
            run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build \
              --commit "$GITHUB_SHA" --event push \
              --json databaseId --jq '.[0].databaseId')
            [ -n "$run" ] && break
            sleep 10
          done
          gh run watch "$run" --repo "$GITHUB_REPOSITORY" --exit-status --interval 30
      # GITHUB_TOKEN's tags start no workflows, so packages.yml wouldn't run
      # for a mercuriod release; the app's token does
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master on 2026-10-16
        with:
          toolchain: stable
      - uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

  release-pr:
    runs-on: ubuntu-latest
    if: github.repository_owner == 'frenzox'
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      # GITHUB_TOKEN's pushes start no workflows, so the release PR would get
      # no CI; the app's token does
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_PLZ_APP_ID }}
          private-key: ${{ secrets.RELEASE_PLZ_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master on 2026-10-16
        with:
          toolchain: stable
      - uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
