name: packages

on:
  push:
    tags: ['mercuriod-v*', 'recado-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build packages for, such as mercuriod-v0.4.1
        required: true

jobs:
  packages:
    # cross's images have an old glibc, so the binaries also run on older
    # distributions than the runner's
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - armv7-unknown-linux-gnueabihf
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      TARGET: ${{ matrix.target }}
      CRATE: ${{ startsWith(inputs.tag || github.ref_name, 'recado-') && 'recado' || 'mercuriod' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cross,cargo-deb,cargo-generate-rpm
      - name: Build
        run: >
          cross build --release --locked -p "$CRATE" --target "$TARGET"
          --config profile.release.debug=false --config profile.release.strip=true
      - name: Package
        run: |
          cargo deb -p "$CRATE" --target "$TARGET" --no-build --no-strip
          cargo generate-rpm -p "$CRATE" --target "$TARGET"
          name="$CRATE-${TAG#"$CRATE"-v}-$TARGET"
          mkdir "$name"
          cp "target/$TARGET/release/$CRATE" "$CRATE/README.md" LICENSE-MIT LICENSE-APACHE "$name/"
          if [ "$CRATE" = mercuriod ]; then
            cp mercuriod/contrib/config.toml mercuriod/contrib/mercuriod.service \
              mercuriod/contrib/mercurio.sysusers "$name/"
          fi
          tar czf "$name.tar.gz" "$name"
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release upload "$TAG" --clobber "$CRATE-${TAG#"$CRATE"-v}-$TARGET.tar.gz"
          target/"$TARGET"/debian/*.deb target/"$TARGET"/generate-rpm/*.rpm
