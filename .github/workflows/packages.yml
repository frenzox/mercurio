name: packages

on:
  push:
    tags: ['mercuriod-v*', 'recado-v*', 'mercurioctl-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build packages for, such as mercuriod-v0.4.1 or mercurioctl-v0.1.0
        required: true

jobs:
  packages:
    # cross's images have an old glibc, so the binaries also run on older
    # distributions than the runner's
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Build provenance attestations
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - armv7-unknown-linux-gnueabihf
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      TARGET: ${{ matrix.target }}
    steps:
      # The tag names the crate: mercuriod-v0.4.1 is mercuriod's
      - name: Crate
        run: echo "CRATE=${TAG%-v*}" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master on 2026-10-16
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cross@0.2.5,cargo-deb@3.8.0,cargo-generate-rpm@0.21.1
      - name: Build
        run: >
          cross build --release --locked -p "$CRATE" --target "$TARGET"
          --config profile.release.debug=false --config profile.release.strip=true
      - name: Package
        run: |
          cargo deb -p "$CRATE" --target "$TARGET" --no-build --no-strip
          cargo generate-rpm -p "$CRATE" --target "$TARGET"
          name="$CRATE-${TAG#"$CRATE"-v}-$TARGET"
          mkdir "$name"
          cp "target/$TARGET/release/$CRATE" "$CRATE/README.md" LICENSE-MIT LICENSE-APACHE "$name/"
          if [ "$CRATE" = mercuriod ]; then
            cp mercuriod/contrib/config.toml mercuriod/contrib/mercuriod.service \
              mercuriod/contrib/mercurio.sysusers "$name/"
          fi
          tar czf "$name.tar.gz" "$name"
          mkdir dist
          mv "$name.tar.gz" target/"$TARGET"/debian/*.deb target/"$TARGET"/generate-rpm/*.rpm dist/
      # Verify a download with: gh attestation verify <file> -R frenzox/mercurio
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      # For the checksums job
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" --clobber dist/*

  # One SHA256SUMS for every file the matrix built, checked with
  # sha256sum --ignore-missing -c SHA256SUMS
  checksums:
    needs: packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > SHA256SUMS
      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" --clobber --repo "$GITHUB_REPOSITORY" dist/SHA256SUMS
