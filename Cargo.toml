[workspace]
resolver = "2"
members = [
    "recado",
    "mercurio-client",
    "mercurio-core",
    "mercurio-packets",
    "mercurio-server",
    "mercurio-storage",
    "mercurio-plugin",
    "mercuriod",
]
exclude = ["examples/plugins", "mercuriod/test-plugins"]

[profile.release]
debug = true  # Enable debug symbols for profiling
