[package]
name = "mercuriod"
version = "0.1.0"
edition = "2021"
description = "Mercurio MQTT broker daemon"
license = "MIT OR Apache-2.0"

[[bin]]
name = "mercuriod"
path = "src/main.rs"

[dependencies]
mercurio-core = { path = "../mercurio-core" }
mercurio-client = { path = "../mercurio-client" }
mercurio-server = { path = "../mercurio-server" }
mercurio-storage = { path = "../mercurio-storage", features = ["sqlite"] }

argon2 = "0.5"
clap = { version = "4", features = ["derive"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1.0.154"
bytes = "1.12.1"
sha2 = "0.11.1"
base64 = "0.23.1"
pbkdf2 = { version = "0.13.0", default-features = false, features = ["hmac"] }
ureq = "3.5.1"
