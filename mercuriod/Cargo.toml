[package]
name = "mercuriod"
version = "0.5.0"
edition.workspace = true
rust-version = "1.97"
description = "Mercurio MQTT broker daemon"
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["mqtt", "mqtt5", "broker", "iot", "mosquitto"]
categories = ["network-programming", "command-line-utilities"]

[[bin]]
name = "mercuriod"
path = "src/main.rs"

[features]
default = ["wasm"]
wasm = ["dep:wasmtime", "dep:wasmtime-wasi", "dep:wasmtime-wasi-http", "dep:http", "dep:http-body-util", "dep:anyhow"]

[lints]
workspace = true

[dependencies]
mercurio-core = { path = "../mercurio-core", version = "0.3.0" }
mercurio-client = { path = "../mercurio-client", version = "0.5.0" }
mercurio-server = { path = "../mercurio-server", version = "0.6.0" }
mercurio-scram = { path = "../mercurio-scram", version = "0.1.0" }
mercurio-storage = { path = "../mercurio-storage", version = "0.4.0", features = ["sqlite", "postgres"] }

argon2 = "0.6"
clap.workspace = true
rpassword.workspace = true
serde.workspace = true
toml = "1"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "net", "sync", "time"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
serde_json.workspace = true
bytes = { workspace = true, features = ["std"] }
sha2.workspace = true
base64.workspace = true
pbkdf2.workspace = true
ureq = { version = "3.5.1", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots"] }
rustls.workspace = true
socket2.workspace = true
libc = "0.2.191"
wasmtime = { version = "50.0", optional = true, default-features = false, features = ["anyhow", "runtime", "std", "cranelift", "async", "component-model", "parallel-compilation"] }
wasmtime-wasi = { version = "50.0", optional = true, default-features = false, features = ["p2"] }
wasmtime-wasi-http = { version = "50.0", optional = true, default-features = false, features = ["p2", "default-send-request"] }
http = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }
anyhow = { version = "1", optional = true }

[package.metadata.deb]
maintainer = "Guilherme Felipe da Silva <gfsilva.eng@gmail.com>"
section = "net"
extended-description = """\
Mercurio serves MQTT 3.1, 3.1.1 and 5.0 over TCP, TLS and WebSocket, with
persistence in SQLite or PostgreSQL, bridges and WASM plugins. The service
runs as the mercurio user, reads /etc/mercurio/config.toml and keeps its
state in /var/lib/mercurio."""
depends = "libc6 (>= 2.18), libgcc-s1 | libgcc1, systemd | systemd-standalone-sysusers"
recommends = "mercurioctl"
maintainer-scripts = "contrib/debian"
systemd-units = { unit-scripts = "contrib", enable = true, start = true }
assets = [
    ["target/release/mercuriod", "usr/bin/", "755"],
    # Group mercurio comes from postinst, as the archive can only hold root
    ["contrib/config.toml", "etc/mercurio/config.toml", "640"],
    ["contrib/mercurio.sysusers", "usr/lib/sysusers.d/mercurio.conf", "644"],
    ["README.md", "usr/share/doc/mercuriod/README.md", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/mercuriod", dest = "/usr/bin/mercuriod", mode = "755" },
    { source = "contrib/config.toml", dest = "/etc/mercurio/config.toml", mode = "640", user = "root", group = "mercurio", config = "noreplace" },
    { source = "contrib/mercuriod.service", dest = "/usr/lib/systemd/system/mercuriod.service", mode = "644" },
    { source = "contrib/mercurio.sysusers", dest = "/usr/lib/sysusers.d/mercurio.conf", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/mercuriod/README.md", mode = "644", doc = true },
]
# Before the files are installed, so config.toml can belong to the group;
# the line repeats contrib/mercurio.sysusers, not installed yet
pre_install_script = """
echo 'u mercurio - "Mercurio MQTT broker" /var/lib/mercurio' | systemd-sysusers --replace=/usr/lib/sysusers.d/mercurio.conf - || :
"""
post_install_script = """
systemctl daemon-reload >/dev/null 2>&1 || :
if [ $1 -eq 1 ]; then
    systemctl preset mercuriod.service >/dev/null 2>&1 || :
fi
"""
pre_uninstall_script = """
if [ $1 -eq 0 ]; then
    systemctl --no-reload disable --now mercuriod.service >/dev/null 2>&1 || :
fi
"""
post_uninstall_script = """
systemctl daemon-reload >/dev/null 2>&1 || :
if [ $1 -ge 1 ]; then
    systemctl try-restart mercuriod.service >/dev/null 2>&1 || :
fi
"""

[package.metadata.generate-rpm.recommends]
mercurioctl = "*"
