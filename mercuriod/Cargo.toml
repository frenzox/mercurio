[package]
name = "mercuriod"
version = "0.3.0"
edition = "2021"
rust-version = "1.97"
description = "Mercurio MQTT broker daemon"
license = "MIT OR Apache-2.0"
repository = "https://github.com/frenzox/mercurio"
homepage = "https://frenzox.github.io/mercurio/"
keywords = ["mqtt", "mqtt5", "broker", "iot", "mosquitto"]
categories = ["network-programming", "command-line-utilities"]

[[bin]]
name = "mercuriod"
path = "src/main.rs"

[features]
default = ["wasm"]
wasm = ["dep:wasmtime", "dep:wasmtime-wasi", "dep:wasmtime-wasi-http", "dep:http", "dep:http-body-util", "dep:anyhow"]

[dependencies]
mercurio-core = { path = "../mercurio-core", version = "0.2.0" }
mercurio-client = { path = "../mercurio-client", version = "0.3.0" }
mercurio-server = { path = "../mercurio-server", version = "0.3.0" }
mercurio-storage = { path = "../mercurio-storage", version = "0.3.0", features = ["sqlite", "postgres"] }

argon2 = "0.5"
clap = { version = "4", features = ["derive"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "net", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1.0.154"
bytes = "1.12.1"
sha2 = "0.11.1"
base64 = "0.23.1"
pbkdf2 = { version = "0.13.0", default-features = false, features = ["hmac"] }
ureq = { version = "3.5.1", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots"] }
rustls = "0.23.46"
socket2 = { version = "0.6.5", features = ["all"] }
libc = "0.2.191"
wasmtime = { version = "50.0", optional = true, default-features = false, features = ["anyhow", "runtime", "std", "cranelift", "async", "component-model", "parallel-compilation"] }
wasmtime-wasi = { version = "50.0", optional = true, default-features = false, features = ["p2"] }
wasmtime-wasi-http = { version = "50.0", optional = true, default-features = false, features = ["p2", "default-send-request"] }
http = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }
anyhow = { version = "1", optional = true }
